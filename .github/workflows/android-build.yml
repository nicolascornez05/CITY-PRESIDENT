name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: city-president-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity project and license
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ ! -f "ProjectSettings/ProjectVersion.txt" ]; then
            echo "::error::Projet Unity absent. Ajoutez d'abord Assets/, Packages/ et ProjectSettings/ au dépôt."
            exit 1
          fi
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Secret UNITY_LICENSE absent. Configurez la licence Unity Personal dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 6000.3.0f1
          targetPlatform: Android
          buildsPath: build
          androidAppBundle: false
          allowDirtyBuild: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CITY-PRESIDENT-Android-APK
          path: build/Android/**/*.apk
          if-no-files-found: error
          retention-days: 7
